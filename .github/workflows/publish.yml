name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amtsblatt-mcp/
    permissions:
      id-token: write   # required for Trusted Publisher (OIDC)

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail the run if this version is already on PyPI — lets the
          # MCP Registry job be re-driven (e.g. after a metadata fix) without
          # a version bump being blocked by a duplicate upload.
          skip-existing: true

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Keep server.json in lock-step with the release tag, so the MCP
      # Registry entry and the PyPI package always report the same version.
      - name: Sync server.json version to the published artifact
        run: |
          # pyproject.toml is the single source of truth: it is what the
          # artifact uploaded to PyPI was built from, so it is the only
          # version the registry can find there. The tag must agree with it —
          # otherwise PyPI receives one version and the registry is told to
          # look for another, and the publish fails with a 404 that reads like
          # a PyPI propagation delay but never resolves.
          PYPROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$PYPROJECT_VERSION" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies version $TAG_VERSION, but pyproject.toml says $PYPROJECT_VERSION. PyPI received $PYPROJECT_VERSION; the registry would look for $TAG_VERSION and fail."
              exit 1
            fi
          fi

          VERSION="$PYPROJECT_VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          echo "server.json set to version $VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
