name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, for the live tests only (OPS-001). Everything else runs on PR.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -m "not live"

      # Pin ruff so an upstream release cannot change the default rule set or
      # formatter and break CI on unrelated, untouched code.
      - name: Install pinned ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  allowlist:
    name: Green allow-list invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Run the data-protection tests as their own job so a failure here is
      # unmistakable in the checks list — this is the invariant that matters
      # most in this repository.
      - name: Fail-closed allow-list must hold
        run: PYTHONPATH=src pytest tests/test_allowlist.py -m "not live" -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, allowlist]
    # The GHA cache backend (`type=gha`) writes to the Actions cache and so
    # needs `actions: write`; the top-level `contents: read` would otherwise
    # strip it and make build-push-action fail while initialising the exporter.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: amtsblatt-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      # SEC-007: a Dockerfile that builds but runs as root would still fail the
      # check, so assert the hardening rather than trusting the instructions.
      # The bar is a UID >= 10000, not merely non-zero — the 100-999 system
      # range collides with host accounts under a bind mount.
      - name: Image runs as a non-root user with a high UID
        run: |
          uid=$(docker run --rm amtsblatt-mcp:ci id -u)
          test "$uid" -ge 10000 || { echo "uid $uid is below the required 10000"; exit 1; }
          echo "runs as uid $uid"

      - name: Default seccomp profile is active
        run: |
          mode=$(docker run --rm amtsblatt-mcp:ci python -c \
            "print(next(l.split()[1] for l in open('/proc/self/status') if l.startswith('Seccomp:')))")
          test "$mode" = "2" || { echo "seccomp not filtering (mode $mode)"; exit 1; }
          echo "seccomp mode $mode (filtering)"

      - name: Server imports under a read-only root filesystem
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            amtsblatt-mcp:ci \
            python -c "import amtsblatt_mcp.server; print('ok')"

      - name: Smoke test — image refuses to start without MCP_API_KEY
        run: |
          set +e
          out=$(docker run --rm -e MCP_TRANSPORT=streamable-http amtsblatt-mcp:ci 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Image started without MCP_API_KEY (should have exited non-zero)"
            exit 1
          fi
          echo "$out" | grep -q "MCP_API_KEY" || {
            echo "::error::Expected MCP_API_KEY guidance in stderr"
            exit 1
          }
      # Distinct from the UID check above: USER is now numeric (10001:10001),
      # so this asserts the /etc/passwd entry still resolves. A numeric USER
      # with no passwd entry runs fine but breaks anything doing a name lookup
      # — including some libraries' home-directory resolution.
      - name: Smoke test — UID resolves to a named user
        run: |
          user=$(docker run --rm --entrypoint id amtsblatt-mcp:ci -un)
          echo "User: $user"
          test "$user" = "mcp" || { echo "::error::uid 10001 does not resolve to 'mcp'"; exit 1; }

  live:
    # Only on the nightly schedule or manual dispatch — never on PR/push, so the
    # mainline build is not held hostage to amtsblattportal.ch availability.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Live tests against amtsblattportal.ch
        run: pytest tests/ -m live -v
        env:
          PYTHONPATH: src
        timeout-minutes: 5
