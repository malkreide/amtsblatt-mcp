name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -m "not live"

      - name: Lint
        run: ruff check src/ tests/

  allowlist:
    name: Green allow-list invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Run the data-protection tests as their own job so a failure here is
      # unmistakable in the checks list — this is the invariant that matters
      # most in this repository.
      - name: Fail-closed allow-list must hold
        run: PYTHONPATH=src pytest tests/test_allowlist.py -m "not live" -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, allowlist]
    # The GHA cache backend (`type=gha`) writes to the Actions cache and so
    # needs `actions: write`; the top-level `contents: read` would otherwise
    # strip it and make build-push-action fail while initialising the exporter.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: amtsblatt-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Smoke test — image refuses to start without MCP_API_KEY
        run: |
          set +e
          out=$(docker run --rm -e MCP_TRANSPORT=sse amtsblatt-mcp:ci 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Image started without MCP_API_KEY (should have exited non-zero)"
            exit 1
          fi
          echo "$out" | grep -q "MCP_API_KEY" || {
            echo "::error::Expected MCP_API_KEY guidance in stderr"
            exit 1
          }
      - name: Smoke test — non-root user
        run: |
          user=$(docker run --rm --entrypoint id amtsblatt-mcp:ci -un)
          echo "User: $user"
          test "$user" = "mcp" || { echo "::error::Container is not running as user 'mcp'"; exit 1; }
