services:
  amtsblatt-mcp:
    build: .
    image: amtsblatt-mcp:dev
    ports: ["8000:8000"]
    environment:
      MCP_TRANSPORT: sse
      # Bind all interfaces INSIDE the isolated container so the published port
      # is reachable; the server defaults to 127.0.0.1 otherwise (see server.py).
      MCP_HOST: "0.0.0.0"
      PORT: "8000"
      MCP_API_KEY: ${MCP_API_KEY:?set MCP_API_KEY in your shell or .env}
      MCP_RATE_LIMIT: "60"
      MCP_RATE_WINDOW: "60"
      LOG_LEVEL: INFO
    read_only: true
    cap_drop: [ALL]
    # SEC-007. Docker applies its built-in seccomp profile (the equivalent of
    # Kubernetes' RuntimeDefault) unless security_opt overrides it — so the
    # profile is deliberately NOT listed here. Writing `seccomp:unconfined`
    # would disable it, which is the opposite of what the check asks for.
    # For Kubernetes, set it explicitly; see the securityContext block in
    # docs/container-hardening.md.
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    # Resource limits (SCALE-006): honoured by `docker compose up` (v2).
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
